<div class="sidebar">
  <p class="sidebar__eyebrow">EXPLORE BY MOOD</p>
  <h2>想去哪裡玩？</h2>

  <details class="place-filter category-filter">
    <summary>類別篩選 <span class="place-filter__hint">可複選</span></summary>
    <fieldset>
      <legend class="place-filter__legend">選擇想探索的類別</legend>
      <div class="place-filter__options">
        <label *ngFor="let category of categories" [class.is-selected]="selectedCategories.includes(category.value)">
          <input type="checkbox" [checked]="selectedCategories.includes(category.value)" (change)="toggleCategory(category.value)">
          <span aria-hidden="true">{{ category.icon }}</span>{{ category.name }}
        </label>
      </div>
    </fieldset>
  </details>
  <div class="place-filter__status">
    <p aria-live="polite">{{ selectedCategories.length === 0 ? '全部類別' : '已選 ' + selectedCategories.length + ' 個類別' }}</p>
    <button class="place-filter__clear" type="button" *ngIf="selectedCategories.length > 0" (click)="clearCategories()">清除類別</button>
  </div>

  <details class="place-filter county-filter">
    <summary>縣市篩選 <span class="place-filter__hint">可複選</span></summary>
    <fieldset>
      <legend class="place-filter__legend">選擇想探索的縣市</legend>
      <div class="place-filter__options">
        <label *ngFor="let county of counties" [class.is-selected]="selectedCounties.includes(county)">
          <input type="checkbox" [checked]="selectedCounties.includes(county)" (change)="toggleCounty(county)">
          {{ county }}
        </label>
      </div>
    </fieldset>
  </details>
  <div class="place-filter__status">
    <p aria-live="polite">{{ selectedCounties.length === 0 ? '全部縣市' : '已選 ' + selectedCounties.length + ' 個縣市' }}</p>
    <button class="place-filter__clear" type="button" *ngIf="selectedCounties.length > 0" (click)="clearCounties()">清除縣市</button>
  </div>
</div>
