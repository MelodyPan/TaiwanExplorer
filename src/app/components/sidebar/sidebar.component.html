<div class="sidebar">
  <p class="sidebar__eyebrow">EXPLORE BY MOOD</p>
  <h2>想去哪裡玩？</h2>
  <ul>
    <li><button type="button" [class.active]="selectedCategory === 'ALL'" (click)="filterByCategory('ALL')"><span>✦</span>全部</button></li>
    <li><button type="button" [class.active]="selectedCategory === 'ATTRACTION'" (click)="filterByCategory('ATTRACTION')"><span>🏞</span>景點</button></li>
    <li><button type="button" [class.active]="selectedCategory === 'FOOD'" (click)="filterByCategory('FOOD')"><span>🍜</span>美食</button></li>
    <li><button type="button" [class.active]="selectedCategory === 'CAFE'" (click)="filterByCategory('CAFE')"><span>☕</span>咖啡</button></li>
    <li><button type="button" [class.active]="selectedCategory === 'HOTEL'" (click)="filterByCategory('HOTEL')"><span>🏨</span>住宿</button></li>
    <li><button type="button" [class.active]="selectedCategory === 'CULTURE'" (click)="filterByCategory('CULTURE')"><span>🏛</span>文化</button></li>
    <li><button type="button" [class.active]="selectedCategory === 'NATURE'" (click)="filterByCategory('NATURE')"><span>🌲</span>自然</button></li>
  </ul>

  <details class="county-filter">
    <summary>縣市篩選 <span class="county-filter__hint">可複選</span></summary>
    <fieldset>
      <legend class="county-filter__legend">選擇想探索的縣市</legend>
      <div class="county-filter__options">
        <label *ngFor="let county of counties" [class.is-selected]="selectedCounties.includes(county)">
          <input type="checkbox" [checked]="selectedCounties.includes(county)" (change)="toggleCounty(county)">
          {{ county }}
        </label>
      </div>
    </fieldset>
  </details>
  <div class="county-filter__status">
    <p aria-live="polite">{{ selectedCounties.length === 0 ? '全部縣市' : '已選 ' + selectedCounties.length + ' 個縣市' }}</p>
    <button class="county-filter__clear" type="button" *ngIf="selectedCounties.length > 0" (click)="clearCounties()">清除選取</button>
  </div>
</div>
