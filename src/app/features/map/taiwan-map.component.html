<div id="map"></div>
<div class="location-controls">
  <button type="button" class="location-button" [disabled]="locationLoading" [attr.aria-busy]="locationLoading" (click)="returnToLocation()" title="將目前位置移到地圖正中央">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="6" /><circle cx="12" cy="12" r="2" />
      <path d="M12 2v4m0 12v4M2 12h4m12 0h4" />
    </svg>
    {{ locationLoading ? '定位中…' : currentLocation ? '回到目前位置' : '取得目前位置' }}
  </button>
  <p class="location-status" *ngIf="locationStatus" [class.location-status--error]="locationError" role="status" aria-live="polite">{{ locationStatus }}</p>
</div>
